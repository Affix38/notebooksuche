
spring.application.name=catalog

# Datenbankverbindung (PostgreSQL)
# Zugangsdaten kommen aus Umgebungsvariablen; nach dem Doppelpunkt steht der Standardwert.
# Das Passwort hat bewusst keinen Standardwert: Ohne DB_PASSWORD startet die Anwendung nicht.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notebooksuche}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
